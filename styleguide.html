<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory OS — Styleguide</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="robots" content="noindex" />
    <script>
      (() => {
        const stored = localStorage.getItem('factoryos.theme');
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset['theme'] = stored === 'light' || stored === 'dark' ? stored : system;
      })();
    </script>
  </head>
  <body>
    <div id="styleguide"></div>
    <script type="module" src="/src/styleguide.ts"></script>
  </body>
</html>
