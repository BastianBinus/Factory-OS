<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The robot, head on, at the size a tab gives you. Everything the game draws in
    three dimensions collapses here into two shapes: the chassis and the signal
    stripe. The plate stays dark in both themes on purpose - a favicon does not
    get to know which theme is on, and yellow on dark reads on either.
  -->
  <rect width="32" height="32" rx="7" fill="#14181F"/>
  <rect x="8" y="9" width="16" height="14" rx="3" fill="#F2C12E"/>
  <rect x="8" y="15" width="16" height="2.5" fill="#14181F" opacity=".85"/>
  <rect x="13.5" y="4.5" width="5" height="4.5" rx="1.5" fill="#9AA1AC"/>
</svg>
