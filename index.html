<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory OS</title>
    <meta name="description" content="Write real JavaScript to run a robot factory." />
    <script>
      // Set the theme before first paint so there is no flash of the wrong theme.
      (() => {
        const stored = localStorage.getItem('factoryos.theme');
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset['theme'] = stored === 'light' || stored === 'dark' ? stored : system;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
