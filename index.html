<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory OS — learn JavaScript by running a factory</title>
    <meta name="description" content="Write real JavaScript to run a robot factory. Mine, smelt, assemble, sell, and unlock a new language concept with every upgrade." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Matches the page background so the mobile browser chrome does not fight the theme. -->
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Factory OS" />
    <meta property="og:description" content="A coding game that teaches JavaScript. Your script drives a robot through a 3D factory." />
    <script>
      // Set the theme before first paint so there is no flash of the wrong theme.
      (() => {
        const stored = localStorage.getItem('factoryos.theme');
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset['theme'] = stored === 'light' || stored === 'dark' ? stored : system;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
